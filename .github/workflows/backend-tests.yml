name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"
      - "frontend/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "DEVELOPMENT_PROGRESS.md"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - "frontend/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "DEVELOPMENT_PROGRESS.md"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci_student_performance.db
      JWT_SECRET_KEY: ci-only-not-a-production-secret
      FRONTEND_URL: https://student-performance-prediction-amber.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile backend modules
        run: python -m compileall -q backend
      - name: Run backend tests
        run: python -m pytest tests -q

  docs-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release documentation and smoke-test script
        run: |
          test -s README.md
          test -s DEVELOPMENT_PROGRESS.md
          test -s docs/DEPLOYMENT_GUIDE.md
          test -s docs/ML_METHODOLOGY.md
          test -s docs/ACADEMIC_GROWTH_LAB.md
          test -s docs/SYNTHETIC_DATASET_BENCHMARK.md
          test -s docs/ANDROID_INTEGRATION.md
          test -s scripts/production_smoke.py
          python -m py_compile scripts/production_smoke.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build production frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://student-performance-backend-nujh.onrender.com
        run: npm run build
